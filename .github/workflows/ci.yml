name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and run every example (and confirm the invalid one is rejected)
        run: bash scripts/build_all_examples.sh
      - name: Benchmarks (Jayd -O0 / -O2 vs CPython, outputs must match)
        run: python bench/run_bench.py --runs 1 >> "$GITHUB_STEP_SUMMARY"
